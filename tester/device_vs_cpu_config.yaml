# 自定义设备与 CPU 精度对比测试的容差配置
# 仅用于 device_vs_cpu 模式（APITestCustomDeviceVSCPU）
#
# 优先级：API+dtype > API default > 全局 dtype > 默认硬编码 1e-2
# 注：paddle.float == float32，paddle.int == int32，无单独 key，均命中对应条目

# 全局 dtype 兜底容差
dtype_atol_rtol:
  # 浮点类型：精度越高要求越严
  float64:    [1e-6, 1e-6]   # 双精度，最严格
  float32:    [1e-5, 1e-5]   # 单精度，GPU/CPU 舍入差异典型水平
  float16:    [5e-2, 5e-2]   # 半精度，尾数 10 位，适当放宽
  bfloat16:   [1e-1, 1e-1]   # BF16，尾数仅 7 位，最宽松
  # 复数类型：实部/虚部精度跟随对应实数类型
  complex64:  [1e-5, 1e-5]   # 实部/虚部均为 float32
  complex128: [1e-6, 1e-6]   # 实部/虚部均为 float64
  # 整数类型：GPU/CPU 结果应完全一致，精确匹配
  int8:   [0, 0]
  int16:  [0, 0]
  int32:  [0, 0]
  int64:  [0, 0]
  uint8:  [0, 0]

# API 级细粒度容差（覆盖全局 dtype 兜底）
# atol_rtol:
#   paddle.matmul:
#     default: [1e-2, 1e-2]
#     float16: [8e-2, 8e-2]
#   paddle.nn.functional.layer_norm:
#     default: [2e-2, 2e-2]
#     float16: [1e-1, 1e-1]
