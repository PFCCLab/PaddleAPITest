name: "CI: Static Checks"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-fmt:
    name: lint and fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install development tools
        run: python -m pip install pre-commit==2.17.0
      - name: Run pre-commit
        run: pre-commit run --all-files
