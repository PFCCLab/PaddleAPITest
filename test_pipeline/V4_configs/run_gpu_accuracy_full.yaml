# yaml-language-server: $schema=../run_config.schema.json
name: run_gpu_accuracy_full
runner:
  engine: engineV4
  foreground: true
env:
  FLAGS_use_system_allocator: "true"
  FLAGS_check_cuda_error: "true"
  FLAGS_alloc_fill_value: "255"
  FLAGS_check_nan_inf: "true"
input:
  api_config_file_pattern: tester/api_config/monitor_config/accuracy/GPU/monitoring_configs*.txt
output:
  log_dir: tester/api_config/test_log_gpu_accuracy_full
engine_args:
  accuracy: true
  atol: 0.0
  rtol: 0.0
  bitwise_alignment: true
  num_gpus: -1
  num_workers_per_gpu: 10
