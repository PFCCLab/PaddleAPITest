# yaml-language-server: $schema=../run_config.schema.json
# 通用 1M/大 tensor accuracy 配置：切换 ${APITEST_MODEL} 即可切换测试模型。
# 依赖 CI 提前将 ${APITEST_MODEL}/accuracy/1M.txt 拷贝到 PaddleAPITest 下。
name: run_1M_accuracy
runner:
  engine: engineV4
  foreground: true
input:
  api_config_file: "${APITEST_MODEL}/accuracy/1M.txt"
output:
  log_dir: "test_${APITEST_MODEL}_log_1M_accuracy"
engine_args:
  accuracy_stable: true
  use_gpu_mode: true
  num_gpus: -1
  num_workers_per_gpu: 1
  timeout: 1200
