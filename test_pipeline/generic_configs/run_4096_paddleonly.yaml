# yaml-language-server: $schema=../run_config.schema.json
# 通用 4096（大 shape）paddle_only 配置：切换 ${APITEST_MODEL} 即可切换测试模型。
# 依赖 CI 提前将 ${APITEST_MODEL}/paddleonly/4096.txt 拷贝到 PaddleAPITest 下。
name: run_4096_paddleonly
runner:
  engine: engineV4
  foreground: true
env:
  FLAGS_use_system_allocator: "true"
  FLAGS_check_cuda_error: "true"
  FLAGS_alloc_fill_value: "255"
  FLAGS_check_nan_inf: "true"
input:
  api_config_file: "${APITEST_MODEL}/paddleonly/4096.txt"
output:
  log_dir: "test_${APITEST_MODEL}_log_4096_paddleonly"
engine_args:
  paddle_only: true
  num_gpus: -1
  num_workers_per_gpu: 4
  timeout: 1200
  use_compute_sanitizer: true
